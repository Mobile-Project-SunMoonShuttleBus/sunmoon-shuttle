name: sunmoon_shuttle
description: A Sunmoon University Shuttle Bus Application.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0' # Flutter 호환성을 위해 버전 범위 조정 권장

dependencies:
  # ⭐️ [핵심] 이 부분이 없어서 에러가 났던 겁니다!
  flutter:
    sdk: flutter

  # --- 기존 라이브러리 ---
  path: ^1.9.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  webview_flutter: ^4.9.0
  url_launcher: ^6.3.1
  flutter_markdown: ^0.6.18
  html: ^0.15.4
  intl: ^0.19.0
  flutter_naver_map: ^1.3.0 # 최신 버전 권장 (1.0.0 이상)
  geolocator: ^13.0.1
  flutter_dotenv: ^5.2.1
  
  # ✅ 필수 의존성 추가 (이전에 누락되거나 잘못된 위치에 있던 패키지)
  cupertino_icons: ^1.0.8
  collection: ^1.18.0

dev_dependencies:
  # ⭐️ Flutter 프로젝트는 flutter_lints를 쓰는 게 좋습니다
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0 

# ⭐️ [중요] 이 부분이 있어야 아이콘/폰트 등 UI 리소스를 씁니다
flutter:
  uses-material-design: true
  
  # assets 폴더가 있다면 주석 해제하세요
  assets: # ⬅️ [수정 완료] assets 키워드가 uses-material-design과 동일하게 정렬되었습니다.
    - assets/icons/
    - assets/stops/